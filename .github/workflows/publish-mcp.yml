name: Publish to npm and MCP Registry

on:
  push:
    tags: ["v*"] # release-it creates and pushes these tags

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC (npm trusted publishing + MCP Registry)
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # npm trusted publishing requires npm >= 11.5.1 (bundled with Node 24)
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --if-present

      - name: Build package
        run: npm run build --if-present

      # OIDC trusted publisher: no NODE_AUTH_TOKEN needed.
      # The package must have the trusted publisher configured on npmjs.com
      # (user aficiomaquinas / repo mcp-baserow-schema / workflow publish-mcp.yml).
      - name: Publish package to npm
        run: npm publish

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
